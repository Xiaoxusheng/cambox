<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>CamBox · Camera Workspace</title>
    <script>
      // 防白屏早期底色：JS bundle 加载前先把根底色铺上（dark 默认；light 读缓存）。
      // theme.ts 挂载后接管 data-theme / arco-theme，此处只负责「首帧不闪白」。
      ;(function () {
        try {
          var t = localStorage.getItem('camhub-theme') === 'light' ? 'light' : 'dark'
          document.documentElement.style.background = t === 'light' ? '#f7f7f8' : '#09090b'
        } catch (e) {
          document.documentElement.style.background = '#09090b'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
