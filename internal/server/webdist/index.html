<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>CamBox · Camera Workspace</title>
    <script>
      // 防白屏早期底色：JS bundle 加载前先把根底色铺上。
      // 主题 = cambox-theme（light/dark/system）；兼容旧键 camhub-theme；
      // system 跟随 prefers-color-scheme。theme.ts 挂载后接管 data-theme / arco-theme。
      ;(function () {
        function bg(t) {
          document.documentElement.style.background = t === 'light' ? '#F8F8F7' : '#09090b'
        }
        try {
          var m = localStorage.getItem('cambox-theme')
          if (m !== 'light' && m !== 'dark' && m !== 'system') {
            var legacy = localStorage.getItem('camhub-theme')
            m = legacy === 'light' ? 'light' : legacy === 'dark' ? 'dark' : 'system'
          }
          var t =
            m === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : m
          bg(t)
        } catch (e) {
          bg('dark')
        }
      })()
    </script>
    <script type="module" src="./assets/index-DDkaoR5w.js"></script>
    <link rel="stylesheet" href="./assets/index-CcLf5uJC.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
